name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "$out"
            exit 1
          fi
      - run: go vet ./...
      - name: Allow Chrome's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: go test -race
        shell: bash
        run: go test -count=1 -race -v -timeout 25m ./... 2>&1 | tee test.log
      - name: Fail on skipped tests
        # The browser tests skip when Chrome can't start, which would turn
        # this job green without running them.
        shell: bash
        run: |
          echo "ran: $(grep -c -E '^=== RUN' test.log), passed: $(grep -c -E '^\s*--- PASS' test.log)"
          if grep -E '^\s*--- SKIP' test.log; then
            exit 1
          fi
